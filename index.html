<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>نظام إدارة القطات</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        :root {
            --accent: #FFD700;
            --bg: #000000;
            --card-bg: #121214;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #FFFFFF;
            --text-sec: #8E8E93;
            --success: #32D74B;
            --danger: #FF453A;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Auth UI */
        #app-root, #dock { display: none; }

        .auth-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
        }

        .logo-area {
            font-size: 42px;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(135deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            color: var(--text-sec);
            text-align: center;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-label {
            display: block;
            font-size: 12px;
            color: var(--text-sec);
            margin-bottom: 8px;
            margin-right: 4px;
        }

        .input-field {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 16px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border 0.3s;
            text-align: left; 
        }

        .input-field:focus {
            border-color: var(--accent);
        }

        .btn-action {
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            border: none;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            margin-top: 12px;
        }

        .btn-action:active { transform: scale(0.98); }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: #fff; margin-top: 20px; }

        /* App Interface */
        #app-root {
            flex: 1;
            padding: 20px 20px 120px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 0;
        }

        .nav-tabs {
            display: flex;
            background: var(--card-bg);
            padding: 4px;
            border-radius: 14px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .tab-item {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            border-radius: 11px;
            color: var(--text-sec);
            cursor: pointer;
        }

        .tab-item.active {
            background: #fff;
            color: #000;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .dock {
            position: fixed;
            bottom: 34px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(28, 28, 30, 0.9);
            backdrop-filter: blur(20px);
            padding: 12px 24px;
            border-radius: 24px;
            border: 1px solid var(--border);
            z-index: 1000;
        }

        .add-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px 32px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 15px;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 11000;
            backdrop-filter: blur(5px);
        }

        .modal-box {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            padding: 24px;
            border-radius: 24px;
            border: 1px solid var(--border);
        }

        .hidden { display: none !important; }
        
        .loading-spinner {
            border: 3px solid var(--glass);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 10px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Auth Screen -->
    <div id="auth-screen" class="auth-overlay">
        <div class="auth-card" id="login-form">
            <div class="logo-area">القطّة</div>
            <p class="auth-subtitle">أدخل اسم المستخدم والرمز</p>
            
            <div class="input-group">
                <span class="input-label">Username (English)</span>
                <input type="text" id="username" class="input-field" placeholder="Enter username" dir="ltr">
            </div>
            
            <div class="input-group">
                <span class="input-label">Password</span>
                <input type="password" id="password" class="input-field" placeholder="••••••••" dir="ltr">
            </div>

            <button id="login-btn" class="btn-action btn-primary">تسجيل الدخول</button>
            <div id="login-loader" class="loading-spinner"></div>
            
            <button onclick="toggleAuth('signup')" class="btn-action btn-secondary">إنشاء مستخدم جديد</button>
        </div>

        <div class="auth-card hidden" id="signup-form">
            <div class="logo-area">مستخدم جديد</div>
            <p class="auth-subtitle">اختر اسم مستخدم بالإنجليزية</p>
            
            <div class="input-group">
                <span class="input-label">Username (English only)</span>
                <input type="text" id="s-username" class="input-field" placeholder="e.g. user123" dir="ltr">
            </div>
            
            <div class="input-group">
                <span class="input-label">Password</span>
                <input type="password" id="s-password" class="input-field" placeholder="••••••••" dir="ltr">
            </div>

            <button id="signup-btn" class="btn-action btn-primary">تأكيد التسجيل</button>
            <div id="signup-loader" class="loading-spinner"></div>
            
            <button onclick="toggleAuth('login')" class="btn-action btn-secondary">لديك حساب؟ ادخل هنا</button>
        </div>
    </div>

    <!-- Main Content -->
    <div id="app-root">
        <div class="header">
            <h2>لوحة التحكم</h2>
            <button id="logout-btn" style="background:var(--glass); border:none; color:var(--danger); padding:8px 16px; border-radius:10px; font-weight:600;">خروج</button>
        </div>

        <div class="nav-tabs">
            <div class="tab-item active" id="tab-history" onclick="switchTab('history')">سجل العمليات</div>
            <div class="tab-item" id="tab-members" onclick="switchTab('members')">الأعضاء</div>
        </div>

        <div id="view-history">
            <div id="logs-list"></div>
        </div>

        <div id="view-members" class="hidden">
            <div class="card">
                <h4 style="margin-bottom:12px; font-size:14px;">إضافة عضو للقروب</h4>
                <div style="display:flex; gap:8px;">
                    <input type="text" id="member-name-input" class="input-field" style="margin:0; text-align:right;" placeholder="اسم الشخص">
                    <button id="add-member-btn" class="btn-action btn-primary" style="margin:0; width:50px; padding:0;">+</button>
                </div>
            </div>
            <div id="members-list"></div>
        </div>
    </div>

    <div id="dock" class="dock">
        <button class="add-btn" onclick="openGattahModal()">قطة جديدة +</button>
    </div>

    <div id="gattah-modal" class="modal">
        <div class="modal-box">
            <h3 style="text-align:center; margin-bottom:20px;">حساب قطة</h3>
            <div class="input-group">
                <span class="input-label">إجمالي المبلغ (ريال)</span>
                <input type="number" id="g-total" class="input-field" placeholder="0.00" inputmode="decimal" style="text-align:right;">
            </div>
            <span class="input-label">من شارك؟</span>
            <div id="modal-members-check" style="max-height:180px; overflow-y:auto; margin-bottom:20px;"></div>
            <div style="display:flex; gap:10px;">
                <button onclick="closeGattahModal()" class="btn-action btn-secondary" style="flex:1; margin:0;">إلغاء</button>
                <button id="save-gattah-btn" class="btn-action btn-primary" style="flex:2; margin:0;">حفظ</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, addDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // حاوية الإعدادات لضمان العمل على GitHub أو أي مكان آخر
        let config = {};
        let currentAppId = 'default-app-id';

        try {
            // محاولة جلب الإعدادات من البيئة المحلية (Canvas)
            if (typeof __firebase_config !== 'undefined') {
                config = JSON.parse(__firebase_config);
                currentAppId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
            } else {
                // إذا لم تكن موجودة (مثل GitHub)، ابحث عن قيم افتراضية أو اطلبها
                console.warn("تنبيه: لم يتم العثور على إعدادات Firebase التلقائية. تأكد من إضافتها يدوياً للعمل خارج Canvas.");
                // ملاحظة للمستخدم: يمكنك وضع إعداداتك يدوياً هنا للتشغيل على GitHub
                config = {
                    apiKey: "YOUR_API_KEY",
                    authDomain: "YOUR_PROJECT.firebaseapp.com",
                    projectId: "YOUR_PROJECT_ID",
                    storageBucket: "YOUR_PROJECT.appspot.com",
                    messagingSenderId: "YOUR_ID",
                    appId: "YOUR_APP_ID"
                };
            }
        } catch (e) {
            console.error("خطأ في تحميل الإعدادات:", e);
        }

        const app = initializeApp(config);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let user = null;
        let members = [];
        let logs = [];
        let unsubFriends = null;
        let unsubLogs = null;

        const usernameToEmail = (userStr) => `${userStr.toLowerCase().trim()}@qattah.local`;

        onAuthStateChanged(auth, (u) => {
            user = u;
            if (user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-root').style.display = 'block';
                document.getElementById('dock').style.display = 'block';
                startSync();
            } else {
                if (unsubFriends) unsubFriends();
                if (unsubLogs) unsubLogs();
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-root').style.display = 'none';
                document.getElementById('dock').style.display = 'none';
            }
        });

        const startSync = () => {
            if (!user) return;
            // استخدام currentAppId لضمان الربط بنفس قاعدة البيانات
            unsubFriends = onSnapshot(collection(db, 'artifacts', currentAppId, 'users', user.uid, 'friends'), (s) => {
                members = s.docs.map(d => ({ id: d.id, ...d.data() }));
                renderMembers();
            }, (err) => console.error("خطأ في جلب الأعضاء:", err));

            unsubLogs = onSnapshot(collection(db, 'artifacts', currentAppId, 'users', user.uid, 'logs'), (s) => {
                logs = s.docs.map(d => ({ id: d.id, ...d.data() }));
                renderLogs();
            }, (err) => console.error("خطأ في جلب السجلات:", err));
        };

        window.toggleAuth = (mode) => {
            document.getElementById('login-form').classList.toggle('hidden', mode === 'signup');
            document.getElementById('signup-form').classList.toggle('hidden', mode === 'login');
        };

        window.switchTab = (tab) => {
            document.getElementById('view-history').classList.toggle('hidden', tab !== 'history');
            document.getElementById('view-members').classList.toggle('hidden', tab !== 'members');
            document.getElementById('tab-history').classList.toggle('active', tab === 'history');
            document.getElementById('tab-members').classList.toggle('active', tab === 'members');
        };

        document.getElementById('login-btn').onclick = async () => {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if(!u || !p) return;
            
            document.getElementById('login-loader').style.display = 'block';
            try {
                await signInWithEmailAndPassword(auth, usernameToEmail(u), p);
            } catch(err) {
                console.error(err);
                alert("اسم المستخدم أو الرمز خطأ.");
            } finally {
                document.getElementById('login-loader').style.display = 'none';
            }
        };

        document.getElementById('signup-btn').onclick = async () => {
            const u = document.getElementById('s-username').value;
            const p = document.getElementById('s-password').value;
            
            if(!u || p.length < 6) {
                alert("اسم المستخدم مطلوب والرمز 6 خانات فأكثر");
                return;
            }

            document.getElementById('signup-loader').style.display = 'block';
            try {
                await createUserWithEmailAndPassword(auth, usernameToEmail(u), p);
            } catch(err) {
                console.error(err);
                alert("خطأ: قد يكون اسم المستخدم محجوزاً.");
            } finally {
                document.getElementById('signup-loader').style.display = 'none';
            }
        };

        document.getElementById('logout-btn').onclick = () => signOut(auth);

        document.getElementById('add-member-btn').onclick = async () => {
            const name = document.getElementById('member-name-input').value.trim();
            if (!name || !user) return;
            await addDoc(collection(db, 'artifacts', currentAppId, 'users', user.uid, 'friends'), { name });
            document.getElementById('member-name-input').value = '';
        };

        window.deleteMember = async (id) => {
            if(!user) return;
            await deleteDoc(doc(db, 'artifacts', currentAppId, 'users', user.uid, 'friends', id));
        };

        window.openGattahModal = () => {
            if(members.length === 0) {
                alert("أضف أعضاء القروب أولاً من تبويب (الأعضاء)");
                return;
            }
            const box = document.getElementById('modal-members-check');
            box.innerHTML = members.map(m => `
                <div style="display:flex; justify-content:space-between; padding:12px; background:var(--glass); margin-bottom:8px; border-radius:12px;">
                    <span>${m.name}</span>
                    <input type="checkbox" value="${m.name}" class="m-check" checked style="width:20px; height:20px;">
                </div>
            `).join('');
            document.getElementById('gattah-modal').style.display = 'flex';
        };

        window.closeGattahModal = () => document.getElementById('gattah-modal').style.display = 'none';

        document.getElementById('save-gattah-btn').onclick = async () => {
            const total = parseFloat(document.getElementById('g-total').value);
            const selected = Array.from(document.querySelectorAll('.m-check:checked')).map(c => c.value);
            if (!total || selected.length === 0 || !user) return;

            await addDoc(collection(db, 'artifacts', currentAppId, 'users', user.uid, 'logs'), {
                total,
                perPerson: total / selected.length,
                date: new Date().toLocaleDateString('ar-SA'),
                timestamp: Date.now(),
                participants: selected.map(n => ({ name: n, paid: false }))
            });
            closeGattahModal();
            document.getElementById('g-total').value = '';
        };

        window.togglePaid = async (logId, pIdx) => {
            if(!user) return;
            const log = logs.find(l => l.id === logId);
            log.participants[pIdx].paid = !log.participants[pIdx].paid;
            await updateDoc(doc(db, 'artifacts', currentAppId, 'users', user.uid, 'logs', logId), {
                participants: log.participants
            });
        };

        window.deleteLog = async (id) => {
            if(confirm("حذف العملية؟") && user) {
                await deleteDoc(doc(db, 'artifacts', currentAppId, 'users', user.uid, 'logs', id));
            }
        };

        const renderMembers = () => {
            const list = document.getElementById('members-list');
            list.innerHTML = members.map(m => `
                <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-weight:700;">${m.name}</span>
                    <button onclick="deleteMember('${m.id}')" style="background:none; border:none; color:var(--danger); font-size:12px;">حذف</button>
                </div>
            `).join('');
        };

        const renderLogs = () => {
            const list = document.getElementById('logs-list');
            if (logs.length === 0) {
                list.innerHTML = `<p style="text-align:center; padding:60px; opacity:0.3;">لا توجد عمليات مسجلة</p>`;
                return;
            }
            const sorted = [...logs].sort((a,b) => b.timestamp - a.timestamp);
            list.innerHTML = sorted.map(log => `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; margin-bottom:16px;">
                        <div>
                            <div style="font-size:12px; color:var(--text-sec);">${log.date}</div>
                            <div style="font-size:18px; font-weight:900;">${log.total} ريال</div>
                        </div>
                        <div style="text-align:left;">
                            <div style="color:var(--accent); font-size:13px; font-weight:700;">${log.perPerson.toFixed(2)} / فرد</div>
                            <button onclick="deleteLog('${log.id}')" style="background:none; border:none; color:var(--text-sec); font-size:10px;">حذف</button>
                        </div>
                    </div>
                    <div>
                        ${log.participants.map((p, i) => `
                            <div style="display:flex; justify-content:space-between; padding:10px; background:rgba(255,255,255,0.03); border-radius:12px; margin-bottom:6px; ${p.paid ? 'opacity:0.4;' : ''}">
                                <span style="font-size:14px;">${p.name}</span>
                                <button onclick="togglePaid('${log.id}', ${i})" style="background:${p.paid ? 'var(--success)' : 'var(--glass)'}; border:none; color:#fff; padding:6px 12px; border-radius:10px; font-size:11px; font-weight:700;">
                                    ${p.paid ? 'تم' : 'تسديد'}
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        };
    </script>
</body>
</html>
