<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>القطّة - إدارة المصاريف المشتركة</title>
    <!-- استيراد الأيقونات والخطوط -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --accent: #FFD700;
            --accent-dark: #B8860B;
            --bg: #0A0A0B;
            --card: #1C1C1E;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --text: #FFFFFF;
            --text-dim: #A1A1AA;
            --success: #32D74B;
            --danger: #FF453A;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

        /* انميشن البداية Splash Screen */
        #splash-screen {
            position: fixed; inset: 0; background: var(--bg); z-index: 20000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .splash-logo { font-size: 60px; font-weight: 900; background: linear-gradient(135deg, #FFF, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* واجهة الدخول */
        .auth-container { 
            position: fixed; inset: 0; background: var(--bg); z-index: 10000; 
            display: flex; align-items: center; justify-content: center; padding: 24px;
        }
        .auth-card { 
            width: 100%; max-width: 400px; background: var(--card); padding: 32px; 
            border-radius: 32px; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* التصميم العام */
        #app-root { max-width: 500px; margin: 0 auto; padding: 20px 20px 120px; display: none; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0 30px; }
        .logo-small { font-size: 24px; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 8px; }

        /* التبويبات العلوية */
        .nav-tabs { 
            display: flex; background: var(--glass); padding: 6px; border-radius: 20px; 
            margin-bottom: 24px; border: 1px solid var(--border);
        }
        .tab-btn { 
            flex: 1; padding: 12px; text-align: center; border-radius: 16px; 
            color: var(--text-dim); cursor: pointer; transition: 0.3s; font-weight: 600; font-size: 14px;
        }
        .tab-btn.active { background: var(--accent); color: #000; }

        /* البطاقات */
        .card { 
            background: var(--card); border: 1px solid var(--border); 
            border-radius: 24px; padding: 20px; margin-bottom: 16px; 
            transition: transform 0.2s;
        }
        .card:active { transform: scale(0.98); }

        /* قسم المديونيات */
        .debt-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .debt-row:last-child { border: 0; }
        .debt-amount { font-weight: 800; font-size: 18px; }
        .debt-red { color: var(--danger); }
        .debt-green { color: var(--success); }

        /* المدخلات */
        .input-group { margin-bottom: 16px; }
        .input-label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 8px; margin-right: 8px; }
        .input-styled { 
            width: 100%; background: var(--glass); border: 1px solid var(--border); 
            padding: 16px; border-radius: 16px; color: #fff; font-size: 16px; outline: none;
        }
        .input-styled:focus { border-color: var(--accent); }

        /* الأزرار */
        .btn { 
            width: 100%; padding: 18px; border-radius: 18px; border: none; 
            font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.2s; 
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-secondary { background: var(--glass); color: #fff; border: 1px solid var(--border); }

        /* القائمة السفلية */
        .dock { 
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
            width: 90%; max-width: 400px; background: rgba(28, 28, 30, 0.8); 
            backdrop-filter: blur(20px); padding: 15px; border-radius: 30px; 
            border: 1px solid var(--border); z-index: 1000; display: flex; justify-content: center;
        }
        .add-main { 
            background: var(--accent); color: #000; width: 60px; height: 60px; 
            border-radius: 20px; display: flex; align-items: center; justify-content: center; 
            font-size: 28px; border: none; cursor: pointer; box-shadow: 0 10px 20px rgba(255, 215, 0, 0.3);
        }

        /* المودال (النافذة المنبثقة) */
        .modal { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); 
            display: none; align-items: flex-end; justify-content: center; z-index: 11000; 
        }
        .modal-content { 
            background: var(--card); width: 100%; max-width: 500px; 
            padding: 30px; border-radius: 35px 35px 0 0; border: 1px solid var(--border);
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .member-check-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px; background: var(--glass); border-radius: 16px; margin-bottom: 10px;
        }

        .hidden { display: none !important; }
        .error-toast { color: var(--danger); font-size: 13px; text-align: center; margin-top: 10px; font-weight: 600; }
    </style>
</head>
<body>

    <!-- سكرين البداية -->
    <div id="splash-screen">
        <div class="splash-logo">القطّة</div>
        <div style="color: var(--text-dim); margin-top: 10px; font-size: 14px;">جارِ التحميل...</div>
    </div>

    <!-- شاشة الدخول -->
    <div id="auth-screen" class="auth-container hidden">
        <div class="auth-card" id="login-form">
            <h1 style="text-align: center; margin-bottom: 10px;">أهلاً بك</h1>
            <p style="text-align: center; color: var(--text-dim); margin-bottom: 30px;">سجل دخولك لإدارة قطاتك</p>
            
            <div class="input-group">
                <input type="text" id="username" class="input-styled" placeholder="اسم المستخدم (English)" dir="ltr">
            </div>
            <div class="input-group">
                <input type="password" id="password" class="input-styled" placeholder="كلمة المرور" dir="ltr">
            </div>
            
            <button id="login-btn" class="btn btn-primary">تسجيل الدخول</button>
            <div id="login-error" class="error-toast"></div>
            
            <button onclick="toggleAuth('signup')" class="btn btn-secondary" style="margin-top: 16px;">إنشاء حساب جديد</button>
        </div>

        <div class="auth-card hidden" id="signup-form">
            <h1 style="text-align: center; margin-bottom: 10px;">حساب جديد</h1>
            <p style="text-align: center; color: var(--text-dim); margin-bottom: 30px;">الاسم 4 حروف إنجليزية فأكثر</p>
            
            <input type="text" id="s-username" class="input-styled" placeholder="User123" dir="ltr" style="margin-bottom: 16px;">
            <input type="password" id="s-password" class="input-styled" placeholder="كلمة المرور" dir="ltr" style="margin-bottom: 16px;">
            
            <button id="signup-btn" class="btn btn-primary">تأكيد التسجيل</button>
            <div id="signup-error" class="error-toast"></div>
            <button onclick="toggleAuth('login')" class="btn btn-secondary" style="margin-top: 16px;">لديك حساب؟ ارفع للدخول</button>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="app-root">
        <div class="header">
            <div class="logo-small"><i class="ph-fill ph-wallet"></i> القطّة</div>
            <button id="logout-btn" style="background: none; border: none; color: var(--danger); font-weight: 700; cursor: pointer;">خروج</button>
        </div>

        <div class="nav-tabs">
            <div class="tab-btn active" id="tab-logs" onclick="switchTab('logs')">العمليات</div>
            <div class="tab-btn" id="tab-debts" onclick="switchTab('debts')">المديونيات</div>
            <div class="tab-btn" id="tab-members" onclick="switchTab('members')">الأعضاء</div>
        </div>

        <!-- عرض العمليات -->
        <div id="view-logs">
            <div id="logs-list"></div>
        </div>

        <!-- عرض المديونيات (فكرة جديدة) -->
        <div id="view-debts" class="hidden">
            <div class="card">
                <h3 style="margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px;">ملخص المبالغ المطلوبة</h3>
                <div id="debts-list"></div>
            </div>
        </div>

        <!-- عرض الأعضاء -->
        <div id="view-members" class="hidden">
            <div class="card">
                <div class="input-group">
                    <input type="text" id="member-name-input" class="input-styled" placeholder="اسم العضو الجديد">
                </div>
                <button id="add-member-btn" class="btn btn-primary"><i class="ph ph-user-plus"></i> إضافة عضو</button>
            </div>
            <div id="members-list"></div>
        </div>
    </div>

    <!-- الزر العائم -->
    <div id="dock" class="dock">
        <button class="add-main" onclick="openGattahModal()"><i class="ph ph-plus"></i></button>
    </div>

    <!-- مودال إضافة قطة -->
    <div id="gattah-modal" class="modal">
        <div class="modal-content">
            <h2 style="text-align: center; margin-bottom: 24px;">قطة جديدة</h2>
            <div class="input-group">
                <label class="input-label">المبلغ الكلي</label>
                <input type="number" id="g-total" class="input-styled" placeholder="0.00" style="font-size: 24px; font-weight: 800; text-align: center;">
            </div>
            <label class="input-label">اختر المشاركين في القطة:</label>
            <div id="modal-members-check" style="max-height: 250px; overflow-y: auto; margin-bottom: 20px;"></div>
            
            <div style="display: flex; gap: 12px;">
                <button onclick="closeGattahModal()" class="btn btn-secondary">إلغاء</button>
                <button id="save-gattah-btn" class="btn btn-primary">حفظ القطة</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, updateDoc, collection, addDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCz9WFBe0Wpvwxj2i9tjn2Sv9b2BFgrkV0",
            authDomain: "testlogin2-ff086.firebaseapp.com",
            projectId: "testlogin2-ff086",
            storageBucket: "testlogin2-ff086.firebasestorage.app",
            messagingSenderId: "388261231780",
            appId: "1:388261231780:web:8cd3dd9de874b64fccba31"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let user = null;
        let members = [];
        let logs = [];

        // انميشن البداية
        window.addEventListener('load', () => {
            gsap.to(".splash-logo", { scale: 1.2, duration: 1, repeat: -1, yoyo: true, ease: "power1.inOut" });
            setTimeout(() => {
                gsap.to("#splash-screen", { opacity: 0, duration: 0.5, onComplete: () => {
                    document.getElementById('splash-screen').style.display = 'none';
                    if(!user) document.getElementById('auth-screen').classList.remove('hidden');
                }});
            }, 2000);
        });

        onAuthStateChanged(auth, (u) => {
            user = u;
            if (user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-root').style.display = 'block';
                document.getElementById('dock').style.display = 'flex';
                startSync();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-root').style.display = 'none';
                document.getElementById('dock').style.display = 'none';
            }
        });

        const startSync = () => {
            if (!user) return;
            onSnapshot(collection(db, 'users_data', user.uid, 'friends'), (s) => {
                members = s.docs.map(d => ({ id: d.id, ...d.data() }));
                renderMembers();
            });
            onSnapshot(collection(db, 'users_data', user.uid, 'logs'), (s) => {
                logs = s.docs.map(d => ({ id: d.id, ...d.data() }));
                renderLogs();
                calculateDebts();
            });
        };

        const toEmail = (u) => `${u.toLowerCase().trim()}@qattah.local`;

        document.getElementById('login-btn').onclick = async () => {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            const err = document.getElementById('login-error');
            if (!u || !p) return;
            try { await signInWithEmailAndPassword(auth, toEmail(u), p); }
            catch (e) { err.innerText = "اسم المستخدم أو كلمة المرور غير صحيحة"; }
        };

        document.getElementById('signup-btn').onclick = async () => {
            const u = document.getElementById('s-username').value.trim();
            const p = document.getElementById('s-password').value;
            const err = document.getElementById('signup-error');
            if (u.length < 4) { err.innerText = "الاسم قصير جداً"; return; }
            try { await createUserWithEmailAndPassword(auth, toEmail(u), p); }
            catch (e) { err.innerText = "حدث خطأ في إنشاء الحساب"; }
        };

        document.getElementById('logout-btn').onclick = () => signOut(auth);

        window.toggleAuth = (mode) => {
            document.getElementById('login-form').classList.toggle('hidden', mode === 'signup');
            document.getElementById('signup-form').classList.toggle('hidden', mode === 'login');
        };

        window.switchTab = (tab) => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            
            document.getElementById('view-logs').classList.toggle('hidden', tab !== 'logs');
            document.getElementById('view-debts').classList.toggle('hidden', tab !== 'debts');
            document.getElementById('view-members').classList.toggle('hidden', tab !== 'members');
        };

        // إدارة الأعضاء
        document.getElementById('add-member-btn').onclick = async () => {
            const n = document.getElementById('member-name-input').value.trim();
            if (n && user) await addDoc(collection(db, 'users_data', user.uid, 'friends'), { name: n });
            document.getElementById('member-name-input').value = "";
        };

        const renderMembers = () => {
            document.getElementById('members-list').innerHTML = members.map(m => `
                <div class="card" style="display:flex; justify-content:space-between; align-items:center; padding:15px 20px;">
                    <span style="font-weight:700; font-size:16px;">${m.name}</span>
                    <button onclick="deleteMember('${m.id}')" style="color:var(--danger); background:none; border:none;"><i class="ph ph-trash"></i></button>
                </div>
            `).join('');
        };

        window.deleteMember = async (id) => { if(confirm("حذف العضو؟")) await deleteDoc(doc(db, 'users_data', user.uid, 'friends', id)); };

        // إدارة القطات
        window.openGattahModal = () => {
            if(members.length === 0) return alert("أضف أعضاء أولاً");
            document.getElementById('modal-members-check').innerHTML = members.map(m => `
                <div class="member-check-item">
                    <span>${m.name}</span>
                    <input type="checkbox" value="${m.name}" checked class="m-check" style="width:22px; height:22px; accent-color:var(--accent);">
                </div>
            `).join('');
            document.getElementById('gattah-modal').style.display = 'flex';
        };

        window.closeGattahModal = () => document.getElementById('gattah-modal').style.display = 'none';

        document.getElementById('save-gattah-btn').onclick = async () => {
            const total = parseFloat(document.getElementById('g-total').value);
            const sel = Array.from(document.querySelectorAll('.m-check:checked')).map(c => c.value);
            if (!total || sel.length === 0) return;
            await addDoc(collection(db, 'users_data', user.uid, 'logs'), {
                total, per: total/sel.length, date: new Date().toLocaleDateString('ar-SA'),
                parts: sel.map(n => ({ name: n, paid: false })), ts: Date.now()
            });
            closeGattahModal();
            document.getElementById('g-total').value = "";
        };

        const renderLogs = () => {
            const sorted = logs.sort((a,b) => b.ts - a.ts);
            document.getElementById('logs-list').innerHTML = sorted.map(l => `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; margin-bottom:15px; align-items:flex-start;">
                        <div>
                            <div style="font-size:11px; color:var(--text-dim);">${l.date}</div>
                            <div style="font-size:22px; font-weight:900; color:var(--accent);">${l.total} <span style="font-size:12px;">ر.س</span></div>
                        </div>
                        <div style="text-align:left;">
                            <div style="font-size:11px; color:var(--text-dim);">نصيب الفرد</div>
                            <div style="font-weight:700;">${l.per.toFixed(2)}</div>
                        </div>
                    </div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                        ${l.parts.map((p, i) => `
                            <div onclick="updateLog('${l.id}', ${i})" style="padding:12px; background:${p.paid?'rgba(50,215,75,0.1)':'var(--glass)'}; border:1px solid ${p.paid?'var(--success)':'var(--border)'}; border-radius:12px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;">
                                <span style="font-size:13px; font-weight:600; ${p.paid?'text-decoration:line-through; color:var(--text-dim)':''}">${p.name}</span>
                                ${p.paid ? '<i class="ph-fill ph-check-circle" style="color:var(--success)"></i>' : '<i class="ph ph-circle" style="color:var(--text-dim)"></i>'}
                            </div>
                        `).join('')}
                    </div>
                    <button onclick="deleteLog('${l.id}')" style="margin-top:15px; background:none; border:none; color:rgba(255,255,255,0.2); font-size:11px; width:100%;"><i class="ph ph-trash-simple"></i> حذف العملية</button>
                </div>
            `).join('');
        };

        window.updateLog = async (id, idx) => {
            const l = logs.find(x => x.id === id);
            l.parts[idx].paid = !l.parts[idx].paid;
            await updateDoc(doc(db, 'users_data', user.uid, 'logs', id), { parts: l.parts });
        };

        window.deleteLog = async (id) => { if(confirm("حذف العملية؟")) await deleteDoc(doc(db, 'users_data', user.uid, 'logs', id)); };

        // نظام المديونيات الذكي
        const calculateDebts = () => {
            const debtMap = {};
            // تصفير المديونيات
            members.forEach(m => debtMap[m.name] = 0);
            
            // حساب المبالغ الغير مدفوعة
            logs.forEach(l => {
                l.parts.forEach(p => {
                    if (!p.paid) {
                        debtMap[p.name] = (debtMap[p.name] || 0) + l.per;
                    }
                });
            });

            const sortedDebts = Object.entries(debtMap).sort((a,b) => b[1] - a[1]);
            document.getElementById('debts-list').innerHTML = sortedDebts.map(([name, amount]) => `
                <div class="debt-row">
                    <span style="font-weight:600;">${name}</span>
                    <div style="text-align: left;">
                        <span class="debt-amount ${amount > 0 ? 'debt-red' : 'debt-green'}">${amount.toFixed(2)}</span>
                        <span style="font-size:10px; color:var(--text-dim);"> ر.س</span>
                    </div>
                </div>
            `).join('') || '<p style="text-align:center; color:var(--text-dim); padding:20px;">لا توجد مديونيات حالياً</p>';
        };

    </script>
</body>
</html>
