<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>نظام إدارة القطات</title>
    <style>
        :root {
            --accent: #FFD700;
            --bg: #000000;
            --card-bg: #121214;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #FFFFFF;
            --text-sec: #8E8E93;
            --success: #32D74B;
            --danger: #FF453A;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        #app-root, #dock { display: none; }
        .auth-overlay { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
        .auth-card { width: 100%; max-width: 400px; }
        .logo-area { font-size: 42px; font-weight: 900; text-align: center; background: linear-gradient(135deg, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
        .auth-subtitle { color: var(--text-sec); text-align: center; margin-bottom: 32px; font-size: 14px; }
        .input-field { width: 100%; background: var(--card-bg); border: 1px solid var(--border); padding: 16px; border-radius: 16px; color: #fff; font-size: 16px; outline: none; margin-bottom: 12px; text-align: left; }
        .btn-action { width: 100%; padding: 18px; border-radius: 16px; border: none; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: #fff; margin-top: 15px; }
        #app-root { flex: 1; padding: 20px 20px 120px; max-width: 600px; margin: 0 auto; width: 100%; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; }
        .nav-tabs { display: flex; background: var(--card-bg); padding: 4px; border-radius: 14px; margin-bottom: 24px; border: 1px solid var(--border); }
        .tab-item { flex: 1; padding: 10px; text-align: center; font-size: 14px; border-radius: 11px; color: var(--text-sec); cursor: pointer; }
        .tab-item.active { background: #fff; color: #000; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 16px; }
        .dock { position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%); background: rgba(28, 28, 30, 0.9); backdrop-filter: blur(20px); padding: 12px 24px; border-radius: 24px; border: 1px solid var(--border); z-index: 1000; }
        .add-btn { background: var(--accent); color: #000; border: none; padding: 12px 32px; border-radius: 14px; font-weight: 800; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 11000; }
        .modal-box { background: var(--card-bg); width: 100%; max-width: 400px; padding: 24px; border-radius: 24px; border: 1px solid var(--border); }
        .error-msg { color: var(--danger); font-size: 13px; text-align: center; margin-top: 10px; display: none; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="auth-screen" class="auth-overlay">
        <div class="auth-card" id="login-form">
            <div class="logo-area">القطّة</div>
            <p class="auth-subtitle">سجل دخولك أو أنشئ حساباً (4 حروف فأكثر)</p>
            <input type="text" id="username" class="input-field" placeholder="Username (English)" dir="ltr">
            <input type="password" id="password" class="input-field" placeholder="Password" dir="ltr">
            <button id="login-btn" class="btn-action btn-primary">دخول</button>
            <div id="login-error" class="error-msg"></div>
            <button onclick="toggleAuth('signup')" class="btn-action btn-secondary">إنشاء مستخدم جديد</button>
        </div>

        <div class="auth-card hidden" id="signup-form">
            <div class="logo-area">حساب جديد</div>
            <p class="auth-subtitle">استخدم اسماً من 4 حروف إنجليزية</p>
            <input type="text" id="s-username" class="input-field" placeholder="User123" dir="ltr">
            <input type="password" id="s-password" class="input-field" placeholder="••••••••" dir="ltr">
            <button id="signup-btn" class="btn-action btn-primary">تأكيد التسجيل</button>
            <div id="signup-error" class="error-msg"></div>
            <button onclick="toggleAuth('login')" class="btn-action btn-secondary">لديك حساب؟ ارجع للدخول</button>
        </div>
    </div>

    <div id="app-root">
        <div class="header">
            <h2>لوحة التحكم</h2>
            <button id="logout-btn" style="background:var(--danger); border:none; color:white; padding:8px 16px; border-radius:10px; font-weight:bold;">خروج</button>
        </div>
        <div class="nav-tabs">
            <div class="tab-item active" id="tab-history" onclick="switchTab('history')">العمليات</div>
            <div class="tab-item" id="tab-members" onclick="switchTab('members')">الأعضاء</div>
        </div>
        <div id="view-history"><div id="logs-list"></div></div>
        <div id="view-members" class="hidden">
            <div class="card">
                <input type="text" id="member-name-input" class="input-field" style="text-align:right;" placeholder="اسم العضو (مثلاً: خالد)">
                <button id="add-member-btn" class="btn-action btn-primary" style="padding:12px;">إضافة عضو للقروب</button>
            </div>
            <div id="members-list"></div>
        </div>
    </div>

    <div id="dock" class="dock"><button class="add-btn" onclick="openGattahModal()">قطة جديدة +</button></div>

    <div id="gattah-modal" class="modal">
        <div class="modal-box">
            <h3 style="text-align:center; margin-bottom:20px;">حساب قطة</h3>
            <input type="number" id="g-total" class="input-field" placeholder="المبلغ الإجمالي" style="text-align:right; margin-bottom:20px;">
            <div id="modal-members-check" style="max-height:200px; overflow-y:auto;"></div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button onclick="closeGattahModal()" class="btn-action btn-secondary" style="margin:0;">إلغاء</button>
                <button id="save-gattah-btn" class="btn-action btn-primary" style="margin:0;">حفظ</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, updateDoc, collection, addDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-fire-store.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";

        // إعداداتك الحقيقية تم دمجها هنا
        const firebaseConfig = {
            apiKey: "AIzaSyCz9WFBe0Wpvwxj2i9tjn2Sv9b2BFgrkV0",
            authDomain: "testlogin2-ff086.firebaseapp.com",
            projectId: "testlogin2-ff086",
            storageBucket: "testlogin2-ff086.firebasestorage.app",
            messagingSenderId: "388261231780",
            appId: "1:388261231780:web:8cd3dd9de874b64fccba31",
            measurementId: "G-P2CELEBCSZ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        if (firebaseConfig.measurementId) getAnalytics(app);

        let user = null;
        let members = [];
        let logs = [];

        onAuthStateChanged(auth, (u) => {
            user = u;
            if (user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-root').style.display = 'block';
                document.getElementById('dock').style.display = 'block';
                startSync();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-root').style.display = 'none';
                document.getElementById('dock').style.display = 'none';
            }
        });

        const startSync = () => {
            if (!user) return;
            onSnapshot(collection(db, 'users_data', user.uid, 'friends'), (s) => {
                members = s.docs.map(d => ({ id: d.id, ...d.data() }));
                renderMembers();
            });
            onSnapshot(collection(db, 'users_data', user.uid, 'logs'), (s) => {
                logs = s.docs.map(d => ({ id: d.id, ...d.data() }));
                renderLogs();
            });
        };

        const toEmail = (u) => `${u.toLowerCase().trim()}@qattah.local`;

        document.getElementById('login-btn').onclick = async () => {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            const err = document.getElementById('login-error');
            err.style.display = 'none';
            if (!u || !p) return;
            try { await signInWithEmailAndPassword(auth, toEmail(u), p); }
            catch (e) { err.innerText = "خطأ في اسم المستخدم أو الرمز"; err.style.display = 'block'; }
        };

        document.getElementById('signup-btn').onclick = async () => {
            const u = document.getElementById('s-username').value.trim();
            const p = document.getElementById('s-password').value;
            const err = document.getElementById('signup-error');
            err.style.display = 'none';
            if (u.length < 4) { err.innerText = "الاسم يجب أن يكون 4 حروف فأكثر"; err.style.display = 'block'; return; }
            try { await createUserWithEmailAndPassword(auth, toEmail(u), p); }
            catch (e) { 
                if(e.code === 'auth/email-already-in-use') err.innerText = "هذا الاسم مستخدم مسبقاً";
                else err.innerText = "الرمز يجب أن يكون 6 خانات فأكثر";
                err.style.display = 'block'; 
            }
        };

        document.getElementById('logout-btn').onclick = () => signOut(auth);

        document.getElementById('add-member-btn').onclick = async () => {
            const n = document.getElementById('member-name-input').value.trim();
            if (n && user) await addDoc(collection(db, 'users_data', user.uid, 'friends'), { name: n });
            document.getElementById('member-name-input').value = "";
        };

        window.toggleAuth = (m) => {
            document.getElementById('login-form').classList.toggle('hidden', m === 'signup');
            document.getElementById('signup-form').classList.toggle('hidden', m === 'login');
        };

        window.switchTab = (t) => {
            document.getElementById('view-history').classList.toggle('hidden', t !== 'history');
            document.getElementById('view-members').classList.toggle('hidden', t !== 'members');
            document.getElementById('tab-history').classList.toggle('active', t === 'history');
            document.getElementById('tab-members').classList.toggle('active', t === 'members');
        };

        window.openGattahModal = () => {
            if(members.length === 0) return alert("أضف أعضاء أولاً");
            const box = document.getElementById('modal-members-check');
            box.innerHTML = members.map(m => `<div style="padding:12px; background:var(--glass); margin-bottom:8px; border-radius:12px; display:flex; justify-content:space-between;">${m.name}<input type="checkbox" value="${m.name}" checked class="m-check" style="width:20px;"></div>`).join('');
            document.getElementById('gattah-modal').style.display = 'flex';
        };

        window.closeGattahModal = () => document.getElementById('gattah-modal').style.display = 'none';

        document.getElementById('save-gattah-btn').onclick = async () => {
            const total = parseFloat(document.getElementById('g-total').value);
            const sel = Array.from(document.querySelectorAll('.m-check:checked')).map(c => c.value);
            if (!total || sel.length === 0) return;
            await addDoc(collection(db, 'users_data', user.uid, 'logs'), {
                total, per: total/sel.length, date: new Date().toLocaleDateString('ar-SA'),
                parts: sel.map(n => ({ name: n, paid: false })), ts: Date.now()
            });
            closeGattahModal();
            document.getElementById('g-total').value = "";
        };

        const renderMembers = () => {
            document.getElementById('members-list').innerHTML = members.map(m => `
                <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-weight:bold;">${m.name}</span>
                    <button onclick="deleteMember('${m.id}')" style="color:var(--danger); background:none; border:none; font-size:12px;">حذف</button>
                </div>
            `).join('');
        };

        window.deleteMember = async (id) => {
            if(confirm("حذف العضو؟")) await deleteDoc(doc(db, 'users_data', user.uid, 'friends', id));
        };

        const renderLogs = () => {
            const sorted = logs.sort((a,b) => b.ts - a.ts);
            document.getElementById('logs-list').innerHTML = sorted.map(l => `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                        <div><div style="font-size:10px; opacity:0.6;">${l.date}</div><div style="font-size:18px; font-weight:900;">${l.total} ريال</div></div>
                        <div style="text-align:left; color:var(--accent); font-weight:bold;">${l.per.toFixed(2)} / شخص</div>
                    </div>
                    ${l.parts.map((p, i) => `
                        <div style="display:flex; justify-content:space-between; padding:10px; background:rgba(255,255,255,0.03); margin-bottom:6px; border-radius:10px; ${p.paid ? 'opacity:0.4' : ''}">
                            <span>${p.name}</span>
                            <button onclick="updateLog('${l.id}', ${i})" style="background:${p.paid?'var(--success)':'var(--glass)'}; color:white; border:none; padding:6px 12px; border-radius:8px; font-size:11px;">${p.paid?'تم التسديد':'تسديد'}</button>
                        </div>
                    `).join('')}
                    <button onclick="deleteLog('${l.id}')" style="margin-top:15px; background:none; border:none; color:var(--text-sec); font-size:10px; width:100%; text-align:center;">حذف العملية بالكامل</button>
                </div>
            `).join('');
        };

        window.updateLog = async (id, idx) => {
            const l = logs.find(x => x.id === id);
            l.parts[idx].paid = !l.parts[idx].paid;
            await updateDoc(doc(db, 'users_data', user.uid, 'logs', id), { parts: l.parts });
        };

        window.deleteLog = async (id) => {
            if(confirm("حذف العملية؟")) await deleteDoc(doc(db, 'users_data', user.uid, 'logs', id));
        };
    </script>
</body>
</html>
